<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tripleS 人生四格產生器</title>
    <!-- 引入 Tailwind CSS 與 html2canvas -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://cloudflare.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6 font-sans">

    <div class="max-w-6xl mx-auto">
        
        <!-- 🌐 頂部語言切換按鈕區 -->
        <div class="flex justify-end gap-2 mb-4">
            <button onclick="changeLanguage('zh')" class="lang-btn px-3 py-1 rounded bg-pink-600 text-xs font-bold cursor-pointer">繁體中文</button>
            <button onclick="changeLanguage('en')" class="lang-btn px-3 py-1 rounded bg-slate-700 hover:bg-slate-600 text-xs font-bold cursor-pointer">English</button>
            <button onclick="changeLanguage('ko')" class="lang-btn px-3 py-1 rounded bg-slate-700 hover:bg-slate-600 text-xs font-bold cursor-pointer">한국어</button>
            <button onclick="changeLanguage('ja')" class="lang-btn px-3 py-1 rounded bg-slate-700 hover:bg-slate-600 text-xs font-bold cursor-pointer">日本語</button>
        </div>

        <!-- 網頁標題與副標題 -->
        <h1 id="web-title" class="text-3xl font-bold text-center text-pink-500 mb-2">💎 tripleS Objekt 四格相簿產生器</h1>
        <p id="web-subtitle" class="text-center text-slate-400 text-sm mb-8">選擇你的本命成員，訂製專屬 tripleS 拍貼相紙！</p>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- 左側控制與設定區 -->
            <div class="lg:col-span-7 bg-slate-800 p-6 rounded-xl shadow-lg space-y-6">
                
                <!-- 1. 成員分頁切換按鈕 (S1-S24) -->
                <div>
                    <h2 id="step-1-title" class="text-lg font-semibold mb-3 text-pink-400">第一步：切換成員 (S1 - S24)</h2>
                    <div class="flex gap-2 overflow-x-auto pb-3 scrollbar-thin scrollbar-thumb-slate-600 max-w-full">
                        <button onclick="switchMember('s1', this)" class="member-btn px-4 py-1.5 rounded-full text-sm font-bold bg-pink-600 text-white cursor-pointer whitespace-nowrap">S1 Seoyeon</button>
                        <button onclick="switchMember('s2', this)" class="member-btn px-4 py-1.5 rounded-full text-sm font-bold bg-slate-700 hover:bg-slate-600 text-slate-300 cursor-pointer whitespace-nowrap">S2 Hyerin</button>
                        <button onclick="switchMember('s3', this)" class="member-btn px-4 py-1.5 rounded-full text-sm font-bold bg-slate-700 hover:bg-slate-600 text-slate-300 cursor-pointer whitespace-nowrap">S3 Jiwoo</button>
                        <button onclick="switchMember('s4', this)" class="member-btn px-4 py-1.5 rounded-full text-sm font-bold bg-slate-700 hover:bg-slate-600 text-slate-300 cursor-pointer whitespace-nowrap">S4 Chaeyeon</button>
                        <button onclick="switchMember('s5', this)" class="member-btn px-4 py-1.5 rounded-full text-sm font-bold bg-slate-700 hover:bg-slate-600 text-slate-300 cursor-pointer whitespace-nowrap">S5 Yooyeon</button>
                        <button onclick="switchMember('s24', this)" class="member-btn px-4 py-1.5 rounded-full text-sm font-bold bg-slate-700 hover:bg-slate-600 text-slate-300 cursor-pointer whitespace-nowrap">S24 JiYeon</button>
                    </div>
                </div>

                <!-- 2. 卡片展示貨櫃區 -->
                <div>
                    <h2 id="step-2-title" class="text-lg font-semibold mb-3 text-pink-400">第二步：挑選 4 張卡片</h2>
                    <div id="card-display-box" class="bg-slate-900 p-3 rounded-lg max-h-[300px] overflow-y-auto">
                        <!-- S1 獨立卡片庫 -->
                        <div id="container-s1" class="member-container grid grid-cols-3 gap-3">
                            <img src="https://placehold.co" onclick="selectCard(this.src)" class="w-full h-24 object-cover rounded-lg cursor-pointer hover:scale-105 transition border-2 border-transparent hover:border-pink-500">
                            <img src="https://placehold.co" onclick="selectCard(this.src)" class="w-full h-24 object-cover rounded-lg cursor-pointer hover:scale-105 transition border-2 border-transparent hover:border-pink-500">
                        </div>
                        <!-- S2 獨立卡片庫 -->
                        <div id="container-s2" class="member-container grid grid-cols-3 gap-3 hidden">
                            <img src="https://placehold.co" onclick="selectCard(this.src)" class="w-full h-24 object-cover rounded-lg cursor-pointer hover:scale-105 transition border-2 border-transparent hover:border-pink-500">
                        </div>
                        <!-- S3 獨立卡片庫 -->
                        <div id="container-s3" class="member-container grid grid-cols-3 gap-3 hidden">
                            <img src="https://placehold.co" onclick="selectCard(this.src)" class="w-full h-24 object-cover rounded-lg cursor-pointer hover:scale-105 transition border-2 border-transparent hover:border-pink-500">
                        </div>
                        <!-- S4 獨立卡片庫 -->
                        <div id="container-s4" class="member-container grid grid-cols-3 gap-3 hidden">
                            <img src="https://placehold.co" onclick="selectCard(this.src)" class="w-full h-24 object-cover rounded-lg cursor-pointer hover:scale-105 transition border-2 border-transparent hover:border-pink-500">
                        </div>
                        <!-- S5 獨立卡片庫 -->
                        <div id="container-s5" class="member-container grid grid-cols-3 gap-3 hidden">
                            <img src="https://placehold.co" onclick="selectCard(this.src)" class="w-full h-24 object-cover rounded-lg cursor-pointer hover:scale-105 transition border-2 border-transparent hover:border-pink-500">
                        </div>
                        <!-- S24 獨立卡片庫 -->
                        <div id="container-s24" class="member-container grid grid-cols-3 gap-3 hidden">
                            <img src="https://placehold.co" onclick="selectCard(this.src)" class="w-full h-24 object-cover rounded-lg cursor-pointer hover:scale-105 transition border-2 border-transparent hover:border-pink-500">
                        </div>
                    </div>
                </div>

                <!-- 3. 更換背景與輸入文字 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <h2 id="step-3-title" class="text-base font-semibold mb-2 text-pink-400">第三步：手動更換底色</h2>
                        <div class="flex gap-2">
                            <button onclick="changeBg('bg-black', 'text-white')" class="w-8 h-8 rounded-full bg-black border border-slate-500 cursor-pointer"></button>
                            <button onclick="changeBg('bg-white', 'text-black')" class="w-8 h-8 rounded-full bg-white border border-slate-500 cursor-pointer"></button>
                            <button onclick="changeBg('bg-pink-500', 'text-white')" class="w-8 h-8 rounded-full bg-pink-500 border border-slate-500 cursor-pointer"></button>
                        </div>
                    </div>
                    <div>
                        <h2 id="step-4-title" class="text-base font-semibold mb-2 text-pink-400">第四步：輸入文字觸發彩蛋</h2>
                        <input type="text" id="user-text-input" oninput="updateText(this.value)" placeholder="輸入英文/韓文名字如：Seoyeon 或 '윤서연'" class="w-full px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-pink-500">
                    </div>
                </div>

                <!-- 按鈕控制區 -->
                <div class="pt-4 flex gap-4 border-t border-slate-700">
                    <button id="btn-clear" onclick="clearAll()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm transition cursor-pointer">
                        🔄 重設清空
                    </button>
                    <button id="btn-download" onclick="downloadPhoto()" class="flex-1 bg-pink-600 hover:bg-pink-500 font-bold py-2 rounded-lg transition text-center shadow-md cursor-pointer">
                        📸 匯出人生四格照片
                    </button>
                </div>
            </div>

            <!-- 右側：人生四格即時預覽區 -->
            <div class="lg:col-span-5 flex flex-col items-center">
                <h2 id="preview-title" class="text-lg font-semibold mb-4 text-pink-400">預覽結果</h2>
                
                <div id="four-cut-box" style="background-color: #000000;" class="text-white p-4 w-64 flex flex-col gap-3 items-center shadow-2xl rounded-sm transition-all duration-300">
                    <div class="slot w-56 h-36 bg-slate-700/50 rounded flex items-center justify-center text-xs text-slate-400 border border-slate-600/30 overflow-hidden"><span class="slot-text">點擊左側卡片</span></div>
                    <div class="slot w-56 h-36 bg-slate-700/50 rounded flex items-center justify-center text-xs text-slate-400 border border-slate-600/30 overflow-hidden"><span class="slot-text">點擊左側卡片</span></div>
                    <div class="slot w-56 h-36 bg-slate-700/50 rounded flex items-center justify-center text-xs text-slate-400 border border-slate-600/30 overflow-hidden"><span class="slot-text">點擊左側卡片</span></div>
                    <div class="slot w-56 h-36 bg-slate-700/50 rounded flex items-center justify-center text-xs text-slate-400 border border-slate-600/30 overflow-hidden"><span class="slot-text">點擊左側卡片</span></div>

                    <div class="w-full text-center mt-1 pt-2 border-t border-zinc-500/20">
                        <p class="font-bold tracking-widest text-sm italic text-pink-500">tripleS</p>
